<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f7; font-family: Arial, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f4f7; padding: 40px 0;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
                    <!-- Header -->
                    <tr>
                        <td style="background: linear-gradient(135deg, #f59e0b, #d97706); padding: 32px 40px; text-align: center;">
                            <h1 style="color: #ffffff; margin: 0; font-size: 24px;">{{appName}}</h1>
                        </td>
                    </tr>
                    <!-- Body -->
                    <tr>
                        <td style="padding: 40px;">
                            <h2 style="color: #1f2937; margin: 0 0 16px;">Contraseña Regenerada</h2>
                            <p style="color: #4b5563; font-size: 16px; line-height: 1.6;">
                                Hola <strong>{{name}}</strong>,
                            </p>
                            <p style="color: #4b5563; font-size: 16px; line-height: 1.6;">
                                Un administrador ha regenerado tu contraseña en <strong>{{appName}}</strong>.
                            </p>
                            <div style="background-color: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 16px; margin: 24px 0;">
                                <p style="color: #92400e; margin: 0 0 8px; font-size: 14px;">Tu nueva contraseña:</p>
                                <p style="color: #92400e; margin: 0; font-size: 18px; font-weight: bold; font-family: monospace;">{{password}}</p>
                            </div>
                            <div style="text-align: center; margin: 32px 0;">
                                <a href="{{link}}" style="background-color: #f59e0b; color: #ffffff; padding: 14px 32px; text-decoration: none; border-radius: 6px; display: inline-block; font-weight: bold; font-size: 16px;">
                                    Iniciar Sesión
                                </a>
                            </div>
                            <p style="color: #9ca3af; font-size: 13px; text-align: center;">
                                O copia este enlace: <a href="{{link}}" style="color: #f59e0b;">{{link}}</a>
                            </p>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="background-color: #f9fafb; padding: 24px 40px; text-align: center; border-top: 1px solid #e5e7eb;">
                            <p style="color: #9ca3af; font-size: 12px; margin: 0;">
                                Este correo fue enviado por <strong>{{appName}}</strong>.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
